# Shared sessions across Deck desktop, phone, and other machines.
# Size the window to the most recently active client, so a phone attaching
# with a tiny terminal does not permanently shrink the desktop view.
set  -g window-size latest
setw -g aggressive-resize on

set  -g mouse on                 # scroll/select with touch on the phone
set  -g history-limit 50000
set -sg escape-time 10
set  -g focus-events on

# Truecolor, so Claude Code's UI renders correctly
set  -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc,*256col*:Tc"

# Status bar shows the session name and HOW MANY clients are attached --
# handy for confirming your phone actually connected.
set  -g status-interval 5
set  -g status-left  "#[bold] #S #[default]"
set  -g status-right " #{session_attached} client(s)  %H:%M "
set  -g status-style "bg=colour236,fg=colour250"

# THE WINDOW LIST SHOWS THIS ACCOUNT ONLY. Key bindings and the window tree
# belong to the SERVER, not to a session, so with two accounts on one server
# `w` listed both and there is no per-session key table to tell them apart.
# run-shell expands #{session_name} once, against the client that pressed the
# key, and bakes that name into the filter; the doubled ## keeps the comparison
# itself from being expanded at the same time. (#{client_session} is empty at
# filter time and a per-session option is re-read per row -- neither works.)
#
#   w   windows of the session you are in        f  inside the chooser edits
#   W   every session on the server                 the filter; empty = all
#   s   one row per session, as before
bind w run-shell -b "tmux choose-tree -Zw -f \"##{==:##{session_name},#{session_name}}\""
bind W choose-tree -Zw
