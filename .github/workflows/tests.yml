# The tick a visitor reads first.
#
# WHAT RUNS HERE and what does not. The Python tests are pure: a temporary
# HOME, no terminal, no daemon, so they run anywhere. The dashboard's own
# proof is a set of GOLDEN SCREENS (tests/goldens/), taken by driving the
# real program inside a private tmux server against a fake machine
# (tests/sandbox/). Those stay LOCAL -- they compare a rendered terminal
# frame, so they are a hostage to the runner's locale, its Rich version and
# its hostname, and a golden that fails for the runner's reasons teaches
# nobody anything. `tests/sandbox/goldens.sh` is the command; the split
# lane's every phase ran it.
#
# The notify shell tests (tests/test_notify_*.sh) drive tmux and jq in their
# own sandbox and are candidates for this file; they are left out until
# somebody has watched them go green in a container rather than on the deck.
name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: install rich
        run: python -m pip install --upgrade pip rich
      - name: muxconfig options parser
        run: python3 tests/test_options.py
      - name: setup-schedules.py -- the eight templates, an edited one kept
        run: python3 tests/test_templates.py
      - name: the settings store and the one settings.json write
        run: python3 tests/test_settings.py
      - name: what a ticked box does to a schedule entry
        run: python3 tests/test_entry_options.py
      - name: the menu layout engine
        run: python3 tests/test_menulayout.py
      - name: the tab strip, fitted to a width
        run: python3 tests/test_tabstrip.py
      - name: hiding a tab, and what it must not do
        run: python3 tests/test_tabs_hidden.py
      - name: the App -- routing, registration, ordering, failure
        run: python3 tests/test_dashboard_app.py
      - name: decode_key -- every escape sequence, and the split read
        run: python3 tests/test_decode_key.py
      - name: pgup/pgdn/home/end page a list and do not leave the view
        run: python3 tests/test_view_paging.py
      - name: ...and the same test against the OLD decoder still shows the bug
        run: python3 tests/test_view_paging.py --counterfactual
      - name: c -- the form, the name it offers, and the sub-window rows
        run: python3 tests/test_newsession.py
      - name: the words a new window is named from
        run: python3 tests/test_naming.py
      - name: muxjson -- the jq stand-in, checked against the real jq
        run: python3 tests/test_muxjson.py
      - name: a window asked for with c is launched, and quickly
        run: python3 tests/test_schedule_launch.py
      - name: the repo sweep lists dirty or ahead trees, and `-` when it cannot know
        run: python3 tests/test_repos_sweep.py
      - name: the usage probe and the watchdog agree on the trust wording
        run: python3 tests/test_trust_wording.py
      - name: every name the dashboard mentions is one it can reach
        run: python3 tests/test_names.py
      - name: muxstats
        run: python3 tests/test_stats.py
      - name: the handover reader, the states and the fork parser
        run: python3 tests/test_handovers.py
      - name: handover.sh -- the marker, and what done carries with it
        run: bash tests/test_handover_sh.sh
      - name: every tmux call names its socket; no bare kill-server anywhere
        run: python3 tests/test_tmux_guard.py
      - name: the dashboard's Restore row, only while a snapshot is frozen
        run: python3 tests/test_restore_row.py
      - name: the manual -- front matter, links, Liquid-safe, nothing lost from the README
        run: python3 tests/test_manual.py
      - name: VERSION is the only place the release number is written
        run: python3 tests/test_version.py
      - name: the header says "unreleased" when the checkout is ahead of its tag
        run: python3 tests/test_unreleased.py
      - name: a release builds from HEAD, and its get.sh installs it into a fresh HOME
        run: bash tests/test_release.sh
      - name: install.sh -- one line per tool, and the fetched python
        run: bash tests/test_install_python.sh
      - name: install.sh -- the closing block says what stops muxtopus running, and the PATH line
        run: bash tests/test_install_done.sh
      - name: the dashboard package imports without a terminal
        run: python3 -c "import deck_status"
